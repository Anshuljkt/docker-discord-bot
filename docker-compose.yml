services:
  docker-discord-bot:
    image: anshuljkt1/docker-discord-bot:latest
    container_name: docker-discord-bot
    volumes:
      - /volume2/docker/docker-discord-bot/settings:/app/settings/:rw
      - /var/run/docker.sock:/var/run/docker.sock
    # user: "501:20"    # Needs to run as root for now...
    environment:
      NODE_ENV: production
      HEALTH_CHECK_PORT: 3021
    ports:
      - 3021:3021
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3021/health',{timeout:4000},r=>process.exit(r.statusCode>=200&&r.statusCode<300?0:1)).on('error',()=>process.exit(1)).on('timeout',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - autoheal=false
    #   - wud.watch=true
    #   - wud.watch.digest=true
    #   - wud.trigger.include=autorun,minute:minor
    restart: unless-stopped
    networks:
      - swagSSL


networks:
  swagSSL:
    external: true